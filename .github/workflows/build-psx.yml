
name: VIZO PSX - Crash Edition Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VIZO PSX ARMv7
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: java -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Verify NDK
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"
          test -f "$ANDROID_NDK_HOME/ndk-build"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make python3 build-essential

      - name: Clone Libretro build system
        run: |
          git clone --depth 1 https://github.com/libretro/libretro-super.git

      - name: Fetch PCSX-ReARMed
        run: |
          cd libretro-super
          ./libretro-fetch.sh pcsx_rearmed

      - name: Build PCSX-ReARMed
        run: |
          cd libretro-super
          chmod +x libretro-build-android-mk.sh
          export PATH="$ANDROID_NDK_HOME:$PATH"
          export TARGET_ABI="armeabi-v7a"
          ./libretro-build-android-mk.sh pcsx_rearmed

      - name: Verify PCSX Core
        run: |
          find libretro-super/dist -type f -name "*.so" -print
          test -f libretro-super/dist/android/armeabi-v7a/pcsx_rearmed_libretro_android.so

      - name: Build VIZO JNI Bridge
        run: |
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE" \
            APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/jni/Android.mk" \
            NDK_APPLICATION_MK="$GITHUB_WORKSPACE/jni/Application.mk"

      - name: Verify JNI Bridge
        run: |
          find libs -type f -name "*.so" -print
          test -f libs/armeabi-v7a/libpsxbridge.so

      - name: Upload PCSX Core
        uses: actions/upload-artifact@v4
        with:
          name: VIZO-PSX-ARMv7
          path: libretro-super/dist/android/armeabi-v7a/pcsx_rearmed_libretro_android.so
          if-no-files-found: error

      - name: Upload JNI Bridge
        uses: actions/upload-artifact@v4
        with:
          name: VIZO-PSX-JNI-ARMv7
          path: libs/armeabi-v7a/libpsxbridge.so
          if-no-files-found: error
