
name: VIZO PSX - Dual ABI Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VIZO PSX 32-bit + 64-bit
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Verify NDK
        run: |
          test -f "$ANDROID_NDK_HOME/ndk-build"
          "$ANDROID_NDK_HOME/ndk-build" --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make python3 build-essential

      - name: Clone Libretro build system
        run: |
          git clone --depth 1 https://github.com/libretro/libretro-super.git

      - name: Fetch PCSX-ReARMed
        run: |
          cd libretro-super
          ./libretro-fetch.sh pcsx_rearmed

      - name: Build PCSX-ReARMed ARMv7
        run: |
          cd libretro-super
          export PATH="$ANDROID_NDK_HOME:$PATH"
          export TARGET_ABI="armeabi-v7a"
          ./libretro-build-android-mk.sh pcsx_rearmed

      - name: Build PCSX-ReARMed ARM64
        run: |
          cd libretro-super
          export PATH="$ANDROID_NDK_HOME:$PATH"
          export TARGET_ABI="arm64-v8a"
          ./libretro-build-android-mk.sh pcsx_rearmed

      - name: Verify PCSX cores
        run: |
          test -f libretro-super/dist/android/armeabi-v7a/pcsx_rearmed_libretro_android.so
          test -f libretro-super/dist/android/arm64-v8a/pcsx_rearmed_libretro_android.so

      - name: Build VIZO JNI Bridge
        run: |
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE" \
            APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/jni/Android.mk" \
            NDK_APPLICATION_MK="$GITHUB_WORKSPACE/jni/Application.mk" \
            APP_ABI="armeabi-v7a arm64-v8a"

      - name: Verify JNI Bridges
        run: |
          test -f libs/armeabi-v7a/libpsxbridge.so
          test -f libs/arm64-v8a/libpsxbridge.so

      - name: Prepare Release
        run: |
          mkdir -p release/armeabi-v7a
          mkdir -p release/arm64-v8a

          cp libretro-super/dist/android/armeabi-v7a/pcsx_rearmed_libretro_android.so release/armeabi-v7a/
          cp libs/armeabi-v7a/libpsxbridge.so release/armeabi-v7a/

          cp libretro-super/dist/android/arm64-v8a/pcsx_rearmed_libretro_android.so release/arm64-v8a/
          cp libs/arm64-v8a/libpsxbridge.so release/arm64-v8a/

      - name: Upload Dual ABI Build
        uses: actions/upload-artifact@v4
        with:
          name: VIZO-PSX-DUAL-ABI
          path: release/
          if-no-files-found: error
          
