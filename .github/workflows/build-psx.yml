
name: VIZO PSX - Build PCSX-ReARMed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARMv7
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git make python3 build-essential

      - name: Clone Libretro build system
        run: |
          git clone --depth 1 https://github.com/libretro/libretro-super.git

      - name: Build PCSX-ReARMed
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_NDK_HOME:$PATH"
          cd libretro-super
          chmod +x libretro-build-android-mk.sh
          ./libretro-build-android-mk.sh pcsx_rearmed

      - name: Locate core
        run: |
          find libretro-super -type f -name "*.so" -print

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: VIZO-PSX-ARMv7
          path: libretro-super/dist/
          if-no-files-found: warn
